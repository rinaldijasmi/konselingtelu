name: Deploy static site to Cloudflare Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-pages-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: cloudflare-pages
      url: https://konseling.kkatelkomuniversity.com
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Prepare static site
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail
          mkdir -p _site/assets/css _site/assets/js
          cp ./*.html _site/
          cp assets/supabase.js assets/telkom-university-logo.png _site/assets/
          cp assets/css/*.css _site/assets/css/
          cp assets/js/*.js _site/assets/js/
          node --input-type=module <<'NODE'
          import fs from "node:fs";

          const url = process.env.SUPABASE_URL;
          const anonKey = process.env.SUPABASE_ANON_KEY;
          if (!url || !anonKey) {
            throw new Error("Set SUPABASE_URL and SUPABASE_ANON_KEY in the GitHub repository settings.");
          }

          let parsedUrl;
          try {
            parsedUrl = new URL(url);
          } catch {
            throw new Error("SUPABASE_URL must be a valid HTTPS URL.");
          }
          if (parsedUrl.protocol !== "https:") {
            throw new Error("SUPABASE_URL must use HTTPS.");
          }
          if (/^sb_secret_/i.test(anonKey)) {
            throw new Error("SUPABASE_ANON_KEY must not be a Supabase secret key.");
          }
          if (anonKey.startsWith("eyJ")) {
            try {
              const payload = JSON.parse(Buffer.from(anonKey.split(".")[1], "base64url").toString());
              if (payload.role === "service_role") {
                throw new Error("SUPABASE_ANON_KEY must not be a service-role key.");
              }
            } catch (error) {
              if (error.message.includes("service-role")) throw error;
            }
          }

          fs.writeFileSync(
            "_site/assets/supabase-config.js",
            `window.SUPABASE_CONFIG = ${JSON.stringify({ url, anonKey })};\n`,
            { mode: 0o600 }
          );
          NODE

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: >-
          npx --yes wrangler@4.151.2 pages deploy _site
          --project-name=konselingtelu
          --branch=main
