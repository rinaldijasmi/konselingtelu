name: Deploy static site to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Prepare static site
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail
          mkdir -p _site/assets/css _site/assets/js
          cp ./*.html _site/
          cp assets/supabase.js assets/telkom-university-logo.png _site/assets/
          cp assets/css/*.css _site/assets/css/
          cp assets/js/*.js _site/assets/js/
          touch _site/.nojekyll
          node --input-type=module <<'NODE'
          import fs from "node:fs";

          const url = process.env.SUPABASE_URL;
          const anonKey = process.env.SUPABASE_ANON_KEY;
          if (!url || !anonKey) {
            throw new Error("Set the SUPABASE_URL repository variable and SUPABASE_ANON_KEY repository secret before deploying.");
          }

          let parsedUrl;
          try {
            parsedUrl = new URL(url);
          } catch {
            throw new Error("SUPABASE_URL must be a valid HTTPS URL.");
          }
          if (parsedUrl.protocol !== "https:") {
            throw new Error("SUPABASE_URL must use HTTPS.");
          }
          if (/^sb_secret_/i.test(anonKey)) {
            throw new Error("SUPABASE_ANON_KEY must not be a Supabase secret key.");
          }
          if (anonKey.startsWith("eyJ")) {
            try {
              const payload = JSON.parse(Buffer.from(anonKey.split(".")[1], "base64url").toString());
              if (payload.role === "service_role") {
                throw new Error("SUPABASE_ANON_KEY must not be a service-role key.");
              }
            } catch (error) {
              if (error.message.includes("service-role")) throw error;
            }
          }

          fs.writeFileSync(
            "_site/assets/supabase-config.js",
            `window.SUPABASE_CONFIG = ${JSON.stringify({ url, anonKey })};\n`,
            { mode: 0o600 }
          );
          NODE

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
