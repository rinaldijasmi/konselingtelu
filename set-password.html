<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#c41230">
    <meta name="description" content="Ganti kata sandi sementara akun layanan konseling Telkom University.">
    <title>Ganti Kata Sandi — Layanan Konseling Telkom University</title>
    <link rel="stylesheet" href="assets/css/set-password.css">
  </head>
  <body>
    <main class="password-card">
      <img src="assets/telkom-university-logo.png" alt="Telkom University">
      <p class="eyebrow">Pengaturan keamanan akun</p>
      <h1>Ganti kata sandi</h1>
      <p class="intro">Untuk keamanan, buat kata sandi pribadi sebelum melanjutkan ke layanan konseling.</p>
      <p class="account-email" id="accountEmail"></p>
      <form id="passwordForm">
        <label for="newPassword">Kata sandi baru</label>
        <input id="newPassword" name="password" type="password" autocomplete="new-password" minlength="12" maxlength="72" required>
        <small>Gunakan minimal 12 karakter. Kata sandi sementara tidak akan berlaku lagi setelah disimpan.</small>
        <label for="confirmPassword">Ulangi kata sandi baru</label>
        <input id="confirmPassword" name="confirm_password" type="password" autocomplete="new-password" minlength="12" maxlength="72" required>
        <p class="form-message" id="passwordMessage" role="status" aria-live="polite"></p>
        <button class="primary-button" type="submit">Simpan kata sandi baru</button>
      </form>
      <button class="logout-button" id="logoutButton" type="button">Keluar dari akun</button>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="assets/supabase-config.js"></script>
    <script src="assets/supabase.js"></script>
    <script src="assets/js/set-password.js"></script>
  </body>
</html>
